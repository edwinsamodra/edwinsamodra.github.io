      labCode: Lab 0.0.1
      detail: "BIOS/UEFI Hardening: Flash the latest Proxmox ISO using Ventoy/Rufus. Enter Acer Nitro BIOS, disable Secure Boot, and enable Intel Virtualization Technology (VT-x) and VT-d to ensure hardware virtualization is active."
